<div class="home-container">
    <h1>Bem-vindo à nossa loja!</h1>
    <p>Confira nossos produtos simples e de qualidade.</p>
  
    <div class="produtos-grid">
      <div class="produto" *ngFor="let p of produtos">
        <img [src]="p.imagem" [alt]="p.nome" />
        <h3>{{ p.nome }}</h3>
        <p class="preco">R$ {{ p.preco | number:'1.2-2' }}</p>
        <button (click)="comprar(p)">Comprar</button>
      </div>
    </div>
  </div>
